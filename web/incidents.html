<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Smart Bus | Incidents</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">🚌</div>AI Smart Bus</div><nav class="nav"><a data-page="dashboard" href="index.html">📊 Dashboard</a><a data-page="incidents" href="incidents.html">🚨 Incidents</a><a data-page="map" href="map.html">🗺️ Live Map</a><a data-page="buses" href="buses.html">🚌 Bus Monitoring</a><a data-page="reports" href="reports.html">📈 Reports</a></nav></aside><main class="main"><div class="top"><div><h1>Incident Reports</h1><div class="muted">Evidence, GPS, confidence, bus and resolution status</div></div><button class="btn secondary" onclick="load()">↻ Refresh</button></div><div class="card"><div class="filters"><input id="search" class="input" placeholder="Search type, bus, location..." oninput="render()"><select id="type" class="select" onchange="render()"><option>All</option><option>garbage</option><option>pothole</option><option>road_damage</option><option>laptop</option><option>person</option></select><select id="status" class="select" onchange="render()"><option>All</option><option>Pending</option><option>Resolved</option></select></div><div id="table" class="table-wrap"></div></div></main></div><script src="app.js"></script><script>nav('incidents');let data=[];async function load(){data=await api('/incidents');render()}function render(){let q=$('#search').value.toLowerCase(),t=$('#type').value.toLowerCase(),s=$('#status').value.toLowerCase();let x=data.filter(i=>(t==='all'||i.type.toLowerCase()===t)&&(s==='all'||i.status.toLowerCase()===s)&&JSON.stringify(i).toLowerCase().includes(q));$('#table').innerHTML=x.length?`<table class="table"><tr><th>ID</th><th>Evidence</th><th>Type</th><th>Bus ID</th><th>GPS Location</th><th>Confidence</th><th>Date / Time</th><th>Status</th><th>Actions</th></tr>${x.map(i=>`<tr><td>#${i.id}</td><td>${photoLink(i.photo,i.type,i.id)}</td><td><b>${typeLabel(i.type)}</b></td><td>${esc(i.bus_id)}</td><td>${i.latitude!=null?`${i.latitude.toFixed(6)}, ${i.longitude.toFixed(6)}<br><a href="https://www.google.com/maps?q=${i.latitude},${i.longitude}" target="_blank">Open location ↗</a>`:'Unavailable'}</td><td>${i.confidence==null?'—':(i.confidence*100).toFixed(1)+'%'}</td><td>${fmt(i.time)}</td><td><span class="pill ${i.status.toLowerCase()==='resolved'?'resolved':'open'}">${esc(i.status)}</span></td><td>${i.status.toLowerCase()!=='resolved'?`<button class="btn" onclick="resolve(${i.id})">Resolve</button>`:''} <button class="btn danger" onclick="del(${i.id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No matching incidents.</div>'}async function resolve(id){await api(`/incidents/${id}/resolve`,{method:'PUT'});load()}async function del(id){if(confirm('Delete this incident and its evidence photo?')){await api(`/incidents/${id}`,{method:'DELETE'});load()}}load();setInterval(load,5000);</script></body></html>
