<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Smart Bus | Reports</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">🚌</div>AI Smart Bus</div><nav class="nav"><a data-page="dashboard" href="index.html">📊 Dashboard</a><a data-page="incidents" href="incidents.html">🚨 Incidents</a><a data-page="map" href="map.html">🗺️ Live Map</a><a data-page="buses" href="buses.html">🚌 Bus Monitoring</a><a data-page="reports" href="reports.html">📈 Reports</a></nav></aside><main class="main"><div class="top"><div><h1>Reports & Analytics</h1><div class="muted">Daily detection trends and exportable incident data</div></div><div><button class="btn secondary" onclick="exportCSV()">⬇ Export CSV</button> <button class="btn" onclick="window.print()">🖨 Print</button></div></div><section class="cards"><div class="card"><div class="stat-label">Total</div><div class="stat" id="total">0</div></div><div class="card"><div class="stat-label">Garbage</div><div class="stat" id="garbage">0</div></div><div class="card"><div class="stat-label">Road Issues</div><div class="stat" id="road">0</div></div><div class="card"><div class="stat-label">Laptop</div><div class="stat" id="laptop">0</div></div></section><div class="card" style="margin-top:18px"><div class="section-title"><h2>Last 7 Days</h2></div><div id="table" class="table-wrap"></div></div><div class="card" style="margin-top:18px"><div class="section-title"><h2>Incident Data</h2></div><div id="all" class="table-wrap"></div></div></main></div><script src="app.js"></script><script>nav('reports');let incidents=[];async function load(){let [s,r,i]=await Promise.all([api('/api/stats'),api('/api/reports?days=7'),api('/incidents')]);incidents=i;$('#total').textContent=s.total_incidents;$('#garbage').textContent=s.garbage;$('#road').textContent=(s.pothole||0)+(s.road_damage||0);$('#laptop').textContent=s.laptop;$('#table').innerHTML=r.length?`<table class="table"><tr><th>Date</th><th>Total</th><th>Garbage</th><th>Pothole</th><th>Road Damage</th><th>Laptop</th></tr>${r.map(x=>`<tr><td>${x.day}</td><td>${x.total}</td><td>${x.garbage}</td><td>${x.pothole}</td><td>${x.road_damage}</td><td>${x.laptop}</td></tr>`).join('')}</table>`:'<div class="empty">No report data yet.</div>';$('#all').innerHTML=i.length?`<table class="table"><tr><th>ID</th><th>Type</th><th>Bus</th><th>Confidence</th><th>Status</th><th>Time</th></tr>${i.map(x=>`<tr><td>#${x.id}</td><td>${typeLabel(x.type)}</td><td>${esc(x.bus_id)}</td><td>${x.confidence==null?'—':(x.confidence*100).toFixed(1)+'%'}</td><td>${esc(x.status)}</td><td>${fmt(x.time)}</td></tr>`).join('')}</table>`:'<div class="empty">No incidents.</div>'}function exportCSV(){let head=['ID','Type','Bus ID','Latitude','Longitude','Confidence','Status','Time'];let rows=incidents.map(x=>[x.id,x.type,x.bus_id,x.latitude,x.longitude,x.confidence,x.status,x.time]);let csv=[head,...rows].map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ai-smart-bus-incidents.csv';a.click();URL.revokeObjectURL(a.href)}load();setInterval(load,10000);</script></body></html>
