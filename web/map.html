<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Smart Bus | Live Map</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">🚌</div>AI Smart Bus</div><nav class="nav"><a data-page="dashboard" href="index.html">📊 Dashboard</a><a data-page="incidents" href="incidents.html">🚨 Incidents</a><a data-page="map" href="map.html">🗺️ Live Map</a><a data-page="buses" href="buses.html">🚌 Bus Monitoring</a><a data-page="reports" href="reports.html">📈 Reports</a></nav></aside><main class="main"><div class="top"><div><h1>Live Map</h1><div class="muted">Bus locations and incident locations</div></div></div><div class="card"><div id="map" class="map" style="height:650px"></div></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script><script>nav('map');let map=L.map('map').setView([23.83,91.28],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);async function load(){map.eachLayer(l=>{if(l instanceof L.Marker)map.removeLayer(l)});let [inc,buses]=await Promise.all([api('/incidents'),api('/api/buses')]);inc.forEach(i=>{if(i.latitude!=null)L.marker([i.latitude,i.longitude]).addTo(map).bindPopup(`<b>🚨 ${typeLabel(i.type)}</b><br>Bus: ${esc(i.bus_id)}<br>Confidence: ${i.confidence?(i.confidence*100).toFixed(1)+'%':'—'}<br><a href="incidents.html">Open incident reports</a>`)});buses.forEach(b=>{if(b.latitude!=null)L.marker([b.latitude,b.longitude]).addTo(map).bindPopup(`<b>🚌 ${esc(b.bus_id)}</b><br>Status: ${b.status}<br>Last seen: ${fmt(b.last_seen)}`)})}load();setInterval(load,5000);</script></body></html>
