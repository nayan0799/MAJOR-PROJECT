<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Smart Bus | Bus Monitoring</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">🚌</div>AI Smart Bus</div><nav class="nav"><a data-page="dashboard" href="index.html">📊 Dashboard</a><a data-page="incidents" href="incidents.html">🚨 Incidents</a><a data-page="map" href="map.html">🗺️ Live Map</a><a data-page="buses" href="buses.html">🚌 Bus Monitoring</a><a data-page="reports" href="reports.html">📈 Reports</a></nav></aside><main class="main"><div class="top"><div><h1>Bus Monitoring</h1><div class="muted">Heartbeat-based active/offline fleet status</div></div></div><div class="cards"><div class="card"><div class="stat-label">Active Buses</div><div id="active" class="stat">0</div></div><div class="card"><div class="stat-label">Total Registered</div><div id="total" class="stat">0</div></div><div class="card"><div class="stat-label">Offline</div><div id="offline" class="stat">0</div></div><div class="card"><div class="stat-label">Rule</div><div class="stat" style="font-size:18px">30 sec</div></div></div><div class="card" style="margin-top:18px"><div id="table" class="table-wrap"></div></div></main></div><script src="app.js"></script><script>nav('buses');async function load(){let x=await api('/api/buses');let a=x.filter(b=>b.status==='ACTIVE').length;$('#active').textContent=a;$('#total').textContent=x.length;$('#offline').textContent=x.length-a;$('#table').innerHTML=x.length?`<table class="table"><tr><th>Bus ID</th><th>Status</th><th>Current Location</th><th>Last Update</th></tr>${x.map(b=>`<tr><td><b>🚌 ${esc(b.bus_id)}</b></td><td><span class="pill ${b.status.toLowerCase()}">${b.status}</span></td><td>${b.latitude!=null?`${Number(b.latitude).toFixed(6)}, ${Number(b.longitude).toFixed(6)}<br><a href="https://www.google.com/maps?q=${b.latitude},${b.longitude}" target="_blank">Open map ↗</a>`:'Unavailable'}</td><td>${fmt(b.last_seen)}</td></tr>`).join('')}</table>`:'<div class="empty">No bus heartbeat received yet. Start yolo_camera.py to register BUS-001.</div>'}load();setInterval(load,5000);</script></body></html>
